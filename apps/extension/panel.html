<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agent Lighthouse — DevTools Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0b;
      color: #fafafa;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #27272a;
    }
    .panel-header h1 { font-size: 18px; font-weight: 700; }
    .panel-header .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      font-weight: 600;
    }
    .url-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .url-bar input {
      flex: 1;
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid #27272a;
      background: #111113;
      color: #fafafa;
      font-size: 13px;
      outline: none;
    }
    .url-bar input:focus { border-color: #6366f1; }
    .url-bar button {
      height: 42px;
      padding: 0 24px;
      border-radius: 10px;
      border: none;
      background: #6366f1;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .url-bar button:hover { background: #5558e6; }
    .url-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

    .loading {
      text-align: center;
      padding: 60px 0;
      color: #71717a;
      display: none;
    }
    .loading.show { display: block; }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #27272a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: none; }
    .results.show { display: block; }

    .score-hero {
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 32px;
      border-radius: 16px;
      background: #111113;
      border: 1px solid #27272a;
      margin-bottom: 24px;
    }
    .score-gauge {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .score-detail h2 { font-size: 16px; margin-bottom: 8px; }
    .score-detail p { font-size: 13px; color: #a1a1aa; line-height: 1.5; max-width: 500px; }
    .score-detail .ts { font-size: 11px; color: #52525b; margin-top: 8px; }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .cat-card {
      padding: 16px;
      border-radius: 12px;
      background: #111113;
      border: 1px solid #27272a;
    }
    .cat-card .cat-name { font-size: 12px; font-weight: 500; margin-bottom: 8px; }
    .cat-card .cat-score { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .cat-card .cat-bar {
      height: 4px;
      border-radius: 2px;
      background: #27272a;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .cat-card .cat-bar-fill { height: 100%; border-radius: 2px; }
    .cat-card .cat-meta { font-size: 10px; color: #52525b; }

    .checks {
      border-radius: 12px;
      background: #111113;
      border: 1px solid #27272a;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .checks-header {
      padding: 12px 20px;
      border-bottom: 1px solid #27272a;
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      font-size: 12px;
      border-bottom: 1px solid #1a1a1d;
    }
    .check-row:last-child { border-bottom: none; }
    .check-row .status { width: 20px; text-align: center; font-size: 12px; font-weight: 700; }
    .check-row .name { flex: 1; }
    .check-row .verify {
      color: #52525b;
      text-decoration: none;
      font-size: 10px;
    }
    .check-row .verify:hover { color: #a1a1aa; }
    .check-row .http-status {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .check-row .score-val { color: #71717a; font-family: monospace; font-size: 11px; min-width: 36px; text-align: right; }

    .error { display: none; text-align: center; padding: 40px; color: #ef4444; }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="panel-header">
    <h1>🔦 Agent Lighthouse</h1>
    <span class="badge">DevTools Panel v1.0</span>
  </div>

  <div class="url-bar">
    <input type="text" id="urlInput" placeholder="Enter URL to audit">
    <button id="auditBtn">▶ Audit</button>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Auditing...</p>
  </div>

  <div id="error" class="error"></div>

  <div id="results" class="results"></div>

  <script src="engine.js"></script>
  <script>
    const AUDIT = AgentLighthouse
    const urlInput = document.getElementById('urlInput')
    const auditBtn = document.getElementById('auditBtn')
    const loading = document.getElementById('loading')
    const errorEl = document.getElementById('error')
    const resultsEl = document.getElementById('results')

    const GRADE_COLORS = {
      A: { bg: "#22c55e", text: "#052e16" },
      B: { bg: "#6366f1", text: "#fafafa" },
      C: { bg: "#f59e0b", text: "#1a1a1a" },
      D: { bg: "#f97316", text: "#1a1a1a" },
      F: { bg: "#ef4444", text: "#fafafa" },
    }
    const CAT_COLORS = ["#6366f1", "#a855f7", "#22c55e", "#f59e0b", "#3b82f6"]

    // Auto-fill from inspected tab
    if (chrome?.devtools?.inspectedWindow) {
      chrome.devtools.inspectedWindow.eval('location.href', (url) => {
        if (url) urlInput.value = url
      })
    }

    auditBtn.addEventListener('click', () => {
      const target = urlInput.value.trim()
      if (target) runAudit(target)
    })

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && urlInput.value.trim()) {
        runAudit(urlInput.value.trim())
      }
    })

    async function runAudit(target) {
      resultsEl.classList.remove('show')
      errorEl.classList.remove('show')
      loading.classList.add('show')
      auditBtn.disabled = true

      try {
        const url = target.startsWith('http') ? target : 'https://' + target
        const result = await AUDIT.auditUrl({ url, timeout: 10000 })
        loading.classList.remove('show')
        renderResults(result)
      } catch (err) {
        loading.classList.remove('show')
        errorEl.textContent = '❌ ' + (err.message || 'Audit failed')
        errorEl.classList.add('show')
        auditBtn.disabled = false
      }
    }

    function renderResults(result) {
      const colors = GRADE_COLORS[result.grade] || GRADE_COLORS.F

      resultsEl.innerHTML = `
        <div class="score-hero">
          <div class="score-gauge" style="background:${colors.bg};color:${colors.text}">${result.overallScore}</div>
          <div class="score-detail">
            <h2>Grade ${result.grade} · ${result.overallScore}/100</h2>
            <p>${result.summary}</p>
            <p class="ts">${result.url} · ${new Date(result.timestamp).toLocaleString()}</p>
          </div>
        </div>

        <div class="cat-grid">
          ${result.categories.map((cat, i) => `
            <div class="cat-card">
              <div class="cat-name">${cat.icon} ${cat.name}</div>
              <div class="cat-score" style="color:${CAT_COLORS[i]}">${cat.score}</div>
              <div class="cat-bar">
                <div class="cat-bar-fill" style="width:${cat.score}%;background:${CAT_COLORS[i]}"></div>
              </div>
              <div class="cat-meta">${cat.checks.filter(c => c.passed).length}/${cat.checks.length} passed · ×${cat.weight.toFixed(2)}</div>
            </div>
          `).join('')}
        </div>

        <div class="checks">
          <div class="checks-header">All Checks</div>
          ${result.categories.flatMap(cat =>
            cat.checks.map(check => {
              const statusColor = check.passed ? "#22c55e" : check.score >= 50 ? "#f59e0b" : "#ef4444"
              const icon = check.passed ? "✓" : check.score >= 50 ? "~" : "✗"
              const httpColor = check.httpStatus === 200 ? "#22c55e" : check.httpStatus === 404 ? "#f59e0b" : check.httpStatus > 0 ? "#ef4444" : "#52525b"
              return `
                <div class="check-row">
                  <span class="status" style="color:${statusColor}">${icon}</span>
                  <span class="name">${check.name}</span>
                  <a class="verify" href="${check.verifiedUrl}" target="_blank">↗ verify</a>
                  ${check.httpStatus > 0 ? `<span class="http-status" style="background:${httpColor}18;color:${httpColor}">${check.httpStatus}</span>` : ''}
                  <span class="score-val">${check.score}%</span>
                </div>
              `
            })
          ).join('')}
        </div>
      `

      resultsEl.classList.add('show')
      auditBtn.disabled = false
    }
  </script>
</body>
</html>
